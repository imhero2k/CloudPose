name: Deploy to EKS

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default is the git SHA)
        required: false
        type: string

concurrency:
  group: deploy-eks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER_NAME || 'cloudpose' }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE || 'cloudpose' }}
  ECR_API_NAME: ${{ vars.ECR_API_NAME || 'cloudpose-api' }}
  ECR_FRONTEND_NAME: ${{ vars.ECR_FRONTEND_NAME || 'cloudpose-frontend' }}

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true
          REACT_APP_API_URL: http://localhost:60000

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        run: terraform fmt -check -recursive
      - name: terraform init
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  build-and-push:
    name: Build and push ECR images
    needs: [api-tests, frontend-tests, terraform]
    runs-on: ubuntu-latest
    environment: eks
    timeout-minutes: 60
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      api_image: ${{ steps.images.outputs.api_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::12}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify AWS deployment configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_GHA_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Missing AWS_GHA_ROLE_ARN. Apply terraform/ and add its github_actions_role_arn output as a repository or environment secret."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          role-session-name: cloudpose-gha-deploy

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URIs
        id: images
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          TAG="${{ steps.meta.outputs.tag }}"
          {
            echo "api_image=${REGISTRY}/${{ env.ECR_API_NAME }}:${TAG}"
            echo "frontend_image=${REGISTRY}/${{ env.ECR_FRONTEND_NAME }}:${TAG}"
            echo "api_latest=${REGISTRY}/${{ env.ECR_API_NAME }}:latest"
            echo "frontend_latest=${REGISTRY}/${{ env.ECR_FRONTEND_NAME }}:latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api_image }}
            ${{ steps.images.outputs.api_latest }}
          cache-from: type=gha,scope=cloudpose-api
          cache-to: type=gha,mode=max,scope=cloudpose-api

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ steps.images.outputs.frontend_latest }}
          cache-from: type=gha,scope=cloudpose-frontend
          cache-to: type=gha,mode=max,scope=cloudpose-frontend

  deploy:
    name: Roll out to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: eks
    timeout-minutes: 20
    steps:
      - name: Verify AWS deployment configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_GHA_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::Missing AWS_GHA_ROLE_ARN in the eks GitHub environment."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GHA_ROLE_ARN }}
          role-session-name: cloudpose-gha-deploy

      - uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${{ env.AWS_REGION }}" \
            --name "${{ env.EKS_CLUSTER }}"

      - name: Deploy new images
        env:
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          NS: ${{ env.K8S_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "${API_IMAGE}" ] || [ -z "${FRONTEND_IMAGE}" ]; then
            echo "Missing image URIs from the build job" >&2
            exit 1
          fi
          kubectl -n "$NS" set image deployment/pose-estimator pose-container="${API_IMAGE}"
          kubectl -n "$NS" set image deployment/cloudpose-frontend nginx="${FRONTEND_IMAGE}"
          kubectl -n "$NS" rollout status deployment/pose-estimator --timeout=10m
          kubectl -n "$NS" rollout status deployment/cloudpose-frontend --timeout=10m
          kubectl -n "$NS" get pods,svc
          echo "API_IMAGE=${API_IMAGE}"
          echo "FRONTEND_IMAGE=${FRONTEND_IMAGE}"
          HOST="$(kubectl -n "$NS" get svc cloudpose-frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          echo "CloudPose URL: http://${HOST}/"

      - name: Deployment summary
        if: always()
        run: |
          kubectl -n "${{ env.K8S_NAMESPACE }}" get deploy,pods,svc || true
